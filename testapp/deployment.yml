apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deployment
  namespace: test-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: test-deployment
        image: webhippie/php-nginx
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
        readinessProbe:
          exec:
            command: ["sh", "-c", "test ! -f /tmp/not-ready"]
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["sh", "-c", "test ! -f /tmp/broken"]
          initialDelaySeconds: 15
          periodSeconds: 10
